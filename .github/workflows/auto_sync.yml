name: Sync Upstream and Auto Build

on:
  schedule:
    # 每天 UTC 时间 20:00（北京时间凌晨 04:00）自动检测原项目更新
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击运行同步

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取并同步上游原仓库的最新代码
      - name: Sync upstream changes
        id: sync
        uses: a2ren/fork-sync@v1.0.0
        with:
          upstream_repository: 15dd/hikari_novel_flutter
          upstream_branch: main # 原项目的主分支名称（如果是 master 请改成 master）
          target_branch: main   # 你 Fork 仓库的主分支名称
          git_pull_args: --ff-only

      # 提示信息
      - name: Check sync result
        run: |
          echo "Upstream sync completed successfully!"
