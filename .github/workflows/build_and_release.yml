name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ] # 每次有代码提交或从原项目同步合并时触发
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 给予创建 Release 的写权限

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境（Flutter Android 编译需要 JDK 17）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 获取依赖项
      - name: Install Dependencies
        run: flutter pub get

      # 5. 从 pubspec.yaml 自动解析项目名称与版本号
      - name: Extract App Version
        id: get_version
        run: |
          # 解析 pubspec.yaml 中的 version 字段 (例如 1.0.0+1)
          RAW_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //g' | tr -d ' "\r\n')
          # 提取纯版本号 (去除构建号 +1，得到 1.0.0)
          CLEAN_VERSION=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          # 解析 pubspec.yaml 中的项目名称 (如 hikari_novel_flutter)
          APP_NAME=$(grep 'name:' pubspec.yaml | head -n 1 | sed 's/name: //g' | tr -d ' "\r\n')
          
          # 导出为环境变量供后续 step 使用
          echo "APP_VERSION=v$CLEAN_VERSION" >> $GITHUB_ENV
          echo "FULL_VERSION=v$RAW_VERSION" >> $GITHUB_ENV
          echo "APK_NAME=${APP_NAME}_v${CLEAN_VERSION}.apk" >> $GITHUB_ENV
          
          echo "解析结果: 版本号=$CLEAN_VERSION, APK文件名=${APP_NAME}_v${CLEAN_VERSION}.apk"

      # 6. 编译 release APK
      - name: Build APK
        run: flutter build apk --release

      # 7. 将 APK 重命名为带版本号的文件名
      - name: Rename APK
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk "output_apk/${{ env.APK_NAME }}"

      # 8. 发布到 GitHub Releases 页面
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }} # 标签名设为版本号，如 v1.0.0
          name: "Hikari Novel ${{ env.APP_VERSION }}"
          body: |
            这是系统自动编译发布的 Release 版本。
            - 原项目版本号: `${{ env.FULL_VERSION }}`
            - 对应 Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            output_apk/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
