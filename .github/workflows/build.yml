name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 Actions 页面手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境（Flutter Android 编译需要 JDK 17）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设置 Flutter 环境（Subosito 官方 Flutter Action）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 获取 Flutter 依赖包
      - name: Install dependencies
        run: flutter pub get

      # 5. 编译 release 版本的 APK
      - name: Build APK
        run: flutter build apk --release

      # 6. 将生成的 APK 上传到 Artifacts（供下载）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
